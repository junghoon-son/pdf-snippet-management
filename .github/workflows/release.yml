name: Release

# Tag-triggered release pipeline. Push a tag like `v0.1.0` to build signed
# desktop bundles for macOS, Windows, and Linux and publish a GitHub Release.
#
#   git tag v0.1.0 && git push --tags
#
# Code-signing and the updater signature are wired via repository secrets.
# When those secrets are absent the build still succeeds — it just produces
# unsigned (and un-notarized) bundles. See .github/RELEASE_SETUP.md.

on:
  push:
    tags:
      - "v*"

# Allow tauri-action to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macOS Apple Silicon
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macOS Intel
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows x64
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux x64
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux desktop bundle dependencies (webkit2gtk + appindicator + rsvg).
      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.3"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (tauri signer generate) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code-signing (Developer ID Application certificate) ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # --- macOS notarization (notarytool) ---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows Authenticode (optional) ---
          # Authenticode is configured in tauri.conf.json (bundle.windows.*).
          # These are passed through for tooling that consumes them; leave the
          # secrets unset to ship unsigned Windows bundles.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # Use the pushed tag (refs/tags/vX.Y.Z) as the release tag/name.
          tagName: ${{ github.ref_name }}
          releaseName: "Marklee ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Marklee ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}
