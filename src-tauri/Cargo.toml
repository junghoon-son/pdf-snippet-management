[package]
name = "pdf-annotator"
version = "0.1.0"
description = "Tauri PDF snippet/annotation app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pdf_annotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
